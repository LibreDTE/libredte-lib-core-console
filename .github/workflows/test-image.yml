name: Test Image

on:
  workflow_call:

jobs:
  test:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (single-platform, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: libredte-lib-core-console:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify a real operation dispatches end to end via docker exec
        run: |
          set -e

          docker run -d --name ci-test libredte-lib-core-console:ci-test

          # Espera a que el contenedor esté realmente corriendo (no solo
          # "creado") antes de intentar un exec sobre él.
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' ci-test)" = "true" ] && break
            sleep 1
          done

          # Despacha una operación de negocio real
          # (billing.identifier.caf_faker::create) vía `docker exec`, sin
          # mocks: el mismo dispatch real que libredte-lib-core-api's
          # test-image.yml verifica por HTTP, aquí vía `bin/console`. El id
          # es determinístico para estos parámetros, no un valor arbitrario
          # a "adivinar".
          response=$(echo '{"parameters": {"emisor": {"rut": "76192083-9", "razon_social": "SASCO SpA"}, "codigoDocumento": 33, "folioDesde": 1, "folioHasta": 100}}' \
            | docker exec -i ci-test bin/console billing:identifier:caf_faker:create)

          echo "$response"

          echo "$response" | grep -q '"id": "CAF33D1H100"' || {
            echo "::error::El dispatch real de billing.identifier.caf_faker::create no devolvió el CAF esperado."
            docker logs ci-test
            exit 1
          }

          docker rm -f ci-test
