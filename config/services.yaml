# Composición de consola con el dispatcher compartido de LibreDTE.
imports:
    - { resource: '../vendor/derafu/backbone-console/resources/config/backbone-console-services.yaml' }
    # Conservar los parámetros y las entradas públicas del dispatcher de LibreDTE.
    - { resource: '../vendor/libredte/libredte-lib-core-dispatcher/resources/config/libredte-dispatcher-services.yaml' }

parameters:
    kernel.app_name: 'LibreDTE Core Console'

services:
    Derafu\BackboneConsole\Contract\ExitCodeResolverInterface:
        class: libredte\lib\CoreConsole\ExitCodeResolver
